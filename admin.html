<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Manage projects — Saqib Ali</title>
<meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1420" media="(prefers-color-scheme: dark)">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A1420'/><g stroke='%23E7A15A' stroke-width='2' fill='none' stroke-linecap='round'><path d='M9 25h14M16 25V11'/><path d='M10 11h12M12 7h8'/></g></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/admin.css">

<script>
(function () {
  try {
    var t = localStorage.getItem("portfolio-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
</head>
<body>

<div class="wrap">
  <header class="bar">
    <h1>Manage projects<span class="dot">.</span></h1>
    <div class="row">
      <a class="btn small" href="./" target="_blank" rel="noopener">View site</a>
      <button class="btn small" id="signout" hidden>Sign out</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <!-- ===================== CONNECT ===================== -->
  <div class="card" id="connectCard">
    <h2>Connect to GitHub</h2>
    <form id="connect">
      <label>GitHub username<input name="owner" value="WhiteScholar-01" required></label>
      <label>Repository<input name="repo" value="My_Portfolio" required></label>
      <label>Branch<input name="branch" value="main" required></label>
      <label>Access token <span class="hint">starts with github_pat_</span>
        <input type="password" name="token" autocomplete="off" required></label>
      <div class="full toggles">
        <label><input type="checkbox" name="remember"> Remember on this device</label>
      </div>
      <div class="full"><button class="btn primary" type="submit">Connect</button></div>
      <p class="msg full" id="connectMsg" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <!-- ===================== FORM ===================== -->
    <div class="card">
      <h2 id="formTitle">Add a project</h2>
      <form id="pform">
        <input type="hidden" name="index" value="">

        <label class="full">Title<input name="title" required></label>

        <label>Folder name <span class="hint">projects/&lt;this&gt;/ — leave it alone unless you know why</span>
          <input name="slug" required pattern="[a-z0-9-]+"></label>
        <label>Where <span class="hint">Orbitalink, IIT Ropar, … optional</span>
          <input name="org"></label>

        <label>Status<select name="status">
          <option>In progress</option><option>Completed</option>
          <option>Planned</option><option>On hold</option>
        </select></label>
        <label>Area<select name="category">
          <option>Motor drives</option><option>Power electronics</option>
          <option>Control</option><option>Embedded</option>
          <option>RF &amp; antennas</option><option>Web</option><option>Other</option>
        </select></label>

        <label>Year<input name="year" placeholder="2026"></label>
        <label>Cover image<input type="file" name="file" accept="image/*">
          <span class="hint">resized, saved to that project's images folder</span></label>

        <label class="full">Short description <span class="hint">one or two sentences on the card</span>
          <textarea name="summary" required maxlength="260" style="min-height:70px"></textarea></label>

        <label class="full">Highlights <span class="hint">one per line — these become "What I did"</span>
          <textarea name="details"></textarea></label>

        <label class="full">Tags <span class="hint">comma separated</span>
          <input name="tags" placeholder="MATLAB, Simulink, FOC"></label>

        <label>Code link<input type="url" name="code_url" placeholder="https://github.com/WhiteScholar-01/..."></label>
        <label>Live demo or report link<input type="url" name="demo_url"></label>

        <label class="full">Image path <span class="hint">filled in after upload, or type projects/&lt;slug&gt;/images/file.jpg</span>
          <input name="image"></label>
        <div class="full" id="imgPreview"></div>

        <div class="full toggles">
          <label><input type="checkbox" name="published" checked> Show on site</label>
          <label><input type="checkbox" name="featured"> Featured (large card)</label>
        </div>

        <div class="full row">
          <button class="btn primary" type="submit" id="addBtn">Add to list</button>
          <button class="btn" type="button" id="clearBtn">Clear form</button>
        </div>
        <p class="msg full" id="formMsg" role="status"></p>
      </form>
    </div>

    <!-- ===================== LIST ===================== -->
    <div class="card">
      <h2>Your projects <span class="hint">top of the list shows first on the site</span></h2>
      <ul class="list" id="list"></ul>
      <p class="hint" style="margin-top:14px">
        Publishing also creates <code>projects/&lt;folder&gt;/index.html</code> and
        <code>README.md</code> for any project that doesn't have them yet.
      </p>
    </div>
  </div>
</div>

<div class="savebar" id="savebar">
  <div class="inner">
    <span id="saveText">You have unpublished changes.</span>
    <div class="row">
      <button class="btn small" id="discardBtn">Discard</button>
      <button class="btn primary" id="publishBtn">Publish to site</button>
    </div>
  </div>
</div>

<script type="module" src="assets/js/admin.js"></script>
</body>
</html>
