<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Manage projects</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B1220;--surface:#141E30;--surface-2:#1B2740;--line:#26334D;--text:#E6EAF2;--muted:#8C97AD;--copper:#E39A4F;--blue:#5B9BF0;--ok:#6FCF97;--err:#F08A8A;--font:"Geist",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 1rem/1.55 var(--font)}
a{color:var(--copper)}
:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:32px 20px 80px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:28px;flex-wrap:wrap}
h1{font-size:1.8rem;letter-spacing:-.03em;margin:0}
h2{font-size:1.15rem;margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px;margin-bottom:24px}
.btn{font:600 .9rem var(--font);padding:10px 18px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--copper);color:var(--copper)}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#1A1206}
.btn.small{padding:6px 12px;font-size:.82rem}
.btn.danger:hover{border-color:var(--err);color:var(--err)}
.row{display:flex;gap:8px;flex-wrap:wrap}
form{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{display:flex;flex-direction:column;gap:5px;font-size:.85rem;color:var(--muted);font-weight:500}
.full{grid-column:1/-1}
input,textarea,select{font:400 .98rem var(--font);padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
textarea{min-height:110px;resize:vertical}
.toggles{display:flex;gap:24px;flex-wrap:wrap}
.toggles label{flex-direction:row;align-items:center;gap:8px;color:var(--text)}
.toggles input{width:18px;height:18px;accent-color:var(--copper)}
.msg{min-height:1.4em;font-size:.9rem;margin:0}
.msg.ok{color:var(--ok)} .msg.err{color:var(--err)}
.hint{font-size:.8rem;color:var(--muted);font-weight:400}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.badge{font-size:.72rem;font-weight:650;padding:2px 8px;border-radius:999px;margin-left:8px;vertical-align:2px}
.badge.draft{background:var(--copper);color:#1A1206}
.badge.live{background:rgba(111,207,151,.15);color:var(--ok)}
.preview-img{max-width:220px;border-radius:8px;border:1px solid var(--line);margin-top:6px}
@media (max-width:640px){form{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Manage projects</h1>
    <div class="row"><a class="btn small" href="./">View site</a><button class="btn small" id="logout" hidden>Sign out</button></div>
  </header>

  <div class="card" id="notConfigured" hidden>
    <h2>Database not connected</h2>
    <p class="hint" style="font-size:.95rem">Add your Supabase Project URL and anon key to <code>config.js</code>, upload it, then reload this page.</p>
  </div>

  <div class="card" id="loginCard" hidden>
    <h2>Sign in</h2>
    <form id="login">
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <div class="full"><button class="btn primary" type="submit">Sign in</button></div>
      <p class="msg full" id="loginMsg" role="alert"></p>
    </form>
  </div>

  <div id="app" hidden>
    <div class="card">
      <h2 id="formTitle">Add a project</h2>
      <form id="pform">
        <input type="hidden" name="id">
        <label class="full">Title<input name="title" required></label>
        <label>Category<select name="category"></select></label>
        <label>Year<input name="year" placeholder="2026"></label>
        <label class="full">One-line summary<input name="summary" required maxlength="220"></label>
        <label class="full">Highlights <span class="hint">One per line. Shown when someone opens the project.</span><textarea name="details"></textarea></label>
        <label class="full">Tags <span class="hint">Comma separated</span><input name="tags" placeholder="MATLAB, Simulink, FOC"></label>
        <label>Code link<input type="url" name="code_url" placeholder="https://github.com/WhiteScholar-01/..."></label>
        <label>Live demo or report link<input type="url" name="demo_url"></label>
        <label>Upload image<input type="file" name="file" accept="image/*"></label>
        <label>Or image link<input name="image" placeholder="https://..."></label>
        <div class="full" id="imgPreview"></div>
        <label>Display order <span class="hint">Lower numbers show first</span><input type="number" name="sort_order" value="100"></label>
        <div class="full toggles">
          <label><input type="checkbox" name="published"> Published (unticked = draft, only you can see it)</label>
          <label><input type="checkbox" name="featured"> Featured (large card)</label>
        </div>
        <div class="full row"><button class="btn primary" type="submit" id="saveBtn">Save project</button><button class="btn" type="button" id="resetBtn">Clear form</button></div>
        <p class="msg full" id="saveMsg" role="status"></p>
      </form>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px">
        <h2 style="margin:0">Your projects</h2>
        <button class="btn small" id="seed" type="button">Import starter projects</button>
      </div>
      <ul class="list" id="list"></ul>
    </div>
  </div>
</div>

<script type="module">
import { SUPABASE_URL, SUPABASE_ANON_KEY, OWNER_EMAIL, IMAGE_BUCKET, CATEGORIES, STARTER_PROJECTS } from "./config.js";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const say = (el, text, ok) => { el.textContent = text; el.className = "msg full " + (ok ? "ok" : "err"); };
const form = $("#pform");
form.category.innerHTML = CATEGORIES.map(c => `<option>${esc(c)}</option>`).join("");
let db, projects = [];

if (!(SUPABASE_URL && SUPABASE_ANON_KEY)) {
  $("#notConfigured").hidden = false;
} else {
  const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
  db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  await view();
}

async function view(){
  const { data:{ session } } = await db.auth.getSession();
  const owner = session && session.user.email?.toLowerCase() === OWNER_EMAIL.toLowerCase();
  if (session && !owner) await db.auth.signOut();
  $("#loginCard").hidden = !!owner; $("#app").hidden = !owner; $("#logout").hidden = !owner;
  if (owner){ resetForm(); await refresh(); }
}

$("#login").onsubmit = async e => {
  e.preventDefault();
  const { error } = await db.auth.signInWithPassword({ email: e.target.email.value.trim(), password: e.target.password.value });
  if (error) return say($("#loginMsg"), "Sign-in failed: " + error.message);
  const { data:{ user } } = await db.auth.getUser();
  if (user.email.toLowerCase() !== OWNER_EMAIL.toLowerCase()) return say($("#loginMsg"), "This account can't manage projects.");
  view();
};
$("#logout").onclick = async () => { await db.auth.signOut(); view(); };

async function refresh(){
  const { data, error } = await db.from("projects").select("*").order("sort_order").order("created_at", {ascending:false});
  if (error) return say($("#saveMsg"), "Couldn't load projects: " + error.message);
  projects = data;
  $("#list").innerHTML = projects.length ? projects.map(p => `
    <li><span>${esc(p.title)}<span class="badge ${p.published ? "live" : "draft"}">${p.published ? "Live" : "Draft"}</span></span>
    <span class="row"><button class="btn small" data-toggle="${p.id}">${p.published ? "Hide" : "Publish"}</button><button class="btn small" data-edit="${p.id}">Edit</button><button class="btn small danger" data-del="${p.id}">Delete</button></span></li>`).join("")
    : `<li class="hint">No projects yet. Add one above or import the starter projects.</li>`;
}

function resetForm(p = {}){
  form.reset();
  form.id.value = p.id ?? "";
  for (const k of ["title","year","summary","image","code_url","demo_url"]) form[k].value = p[k] ?? "";
  form.category.value = p.category ?? CATEGORIES[0];
  form.sort_order.value = p.sort_order ?? 100;
  form.details.value = (p.details || []).join("\n");
  form.tags.value = (p.tags || []).join(", ");
  form.published.checked = p.published ?? true;
  form.featured.checked = !!p.featured;
  $("#formTitle").textContent = p.id ? "Edit project" : "Add a project";
  $("#saveBtn").textContent = p.id ? "Update project" : "Save project";
  $("#imgPreview").innerHTML = p.image ? `<img class="preview-img" src="${esc(p.image)}" alt="">` : "";
}
$("#resetBtn").onclick = () => { resetForm(); $("#saveMsg").textContent = ""; };
form.file.onchange = () => { const f = form.file.files[0]; $("#imgPreview").innerHTML = f ? `<img class="preview-img" src="${URL.createObjectURL(f)}" alt="">` : ""; };

form.onsubmit = async e => {
  e.preventDefault();
  const msg = $("#saveMsg"); say(msg, "Saving…", true); $("#saveBtn").disabled = true;
  try {
    let image = form.image.value.trim();
    const file = form.file.files[0];
    if (file){
      if (file.size > 5*1024*1024) throw new Error("Image is over 5 MB. Please use a smaller one.");
      const path = `${Date.now()}-${file.name.replace(/[^a-z0-9.\-]/gi, "_")}`;
      const up = await db.storage.from(IMAGE_BUCKET).upload(path, file);
      if (up.error) throw up.error;
      image = db.storage.from(IMAGE_BUCKET).getPublicUrl(path).data.publicUrl;
    }
    const row = {
      title: form.title.value.trim(), year: form.year.value.trim(), category: form.category.value,
      summary: form.summary.value.trim(),
      details: form.details.value.split("\n").map(s => s.trim()).filter(Boolean),
      tags: form.tags.value.split(",").map(s => s.trim()).filter(Boolean),
      code_url: form.code_url.value.trim(), demo_url: form.demo_url.value.trim(), image,
      sort_order: Number(form.sort_order.value) || 100,
      published: form.published.checked, featured: form.featured.checked
    };
    const id = form.id.value;
    const { error } = id ? await db.from("projects").update(row).eq("id", id) : await db.from("projects").insert(row);
    if (error) throw error;
    say(msg, `${row.title} ${id ? "updated" : "saved"}${row.published ? "" : " as a draft"}.`, true);
    resetForm(); await refresh();
  } catch (err) { say(msg, "Couldn't save: " + err.message); }
  $("#saveBtn").disabled = false;
};

$("#list").onclick = async e => {
  const b = e.target.closest("button"); if (!b) return;
  const find = id => projects.find(p => String(p.id) === id);
  if (b.dataset.edit){ resetForm(find(b.dataset.edit)); form.scrollIntoView({behavior:"smooth"}); }
  if (b.dataset.toggle){
    const p = find(b.dataset.toggle);
    const { error } = await db.from("projects").update({ published: !p.published }).eq("id", p.id);
    if (error) return say($("#saveMsg"), "Couldn't change visibility: " + error.message);
    say($("#saveMsg"), `${p.title} is now ${p.published ? "a draft" : "live"}.`, true); refresh();
  }
  if (b.dataset.del){
    const p = find(b.dataset.del);
    if (!confirm(`Delete "${p.title}"? This can't be undone.`)) return;
    const { error } = await db.from("projects").delete().eq("id", p.id);
    if (error) return say($("#saveMsg"), "Couldn't delete: " + error.message);
    say($("#saveMsg"), `${p.title} deleted.`, true); refresh();
  }
};

$("#seed").onclick = async () => {
  if (!confirm("Add all starter projects to the database?")) return;
  const { error } = await db.from("projects").insert(STARTER_PROJECTS);
  if (error) return say($("#saveMsg"), "Couldn't import: " + error.message);
  say($("#saveMsg"), "Starter projects imported.", true); refresh();
};
</script>
</body>
</html>
