<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- EDIT THESE TWO LINES when you copy this folder for a new project -->
<title>{{TITLE}} — Saqib Ali</title>
<meta name="description" content="{{DESC}}">
<!-- ---------------------------------------------------------------- -->
<meta name="theme-color" content="#F5F2EB" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0A1420" media="(prefers-color-scheme: dark)">

<meta property="og:type" content="article">
<meta property="og:title" content="{{TITLE}} — Saqib Ali">
<meta property="og:description" content="{{DESC}}">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230A1420'/><g stroke='%23E7A15A' stroke-width='2' fill='none' stroke-linecap='round'><path d='M9 25h14M16 25V11'/><path d='M10 11h12M12 7h8'/></g></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="../../assets/css/tokens.css">
<link rel="stylesheet" href="../../assets/css/site.css">
<link rel="stylesheet" href="../../assets/css/project.css">

<script>
(function () {
  try {
    var t = localStorage.getItem("portfolio-theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
</head>

<!-- data-project is the slug. It must match this folder's name and the
     "slug" field in data/projects.json. -->
<body data-project="{{SLUG}}">

<header class="top scrolled" id="topbar">
  <div class="wrap">
    <a class="mark" href="../../">Saqib<span class="dot">.</span></a>
    <div class="nav-right">
      <nav aria-label="Main">
        <ul id="navlist">
          <li><a href="../../#projects">Projects</a></li>
          <li><a href="../../#experience">Experience</a></li>
          <li><a href="../../#resume">Resume</a></li>
          <li><a href="../../#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Switch theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="icon-btn menu-btn" type="button" aria-expanded="false" aria-controls="navlist" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="pMain">
  <section class="p-hero">
    <div class="wrap">
      <p class="crumb">
        <a href="../../">Home</a><span class="sep">/</span>
        <a href="../../#projects">Projects</a><span class="sep">/</span>
        <span id="pCrumbCat">{{CATEGORY}}</span>
      </p>
      <h1 id="pTitle">{{TITLE}}</h1>
      <p class="p-lede" id="pLede">{{DESC}}</p>
      <dl class="specs" id="pSpecs"></dl>
    </div>
  </section>

  <section class="block" style="padding-top:0">
    <div class="wrap p-body">
      <div>
        <div class="p-section">
          <h2>What I did</h2>
          <div id="pHighlights"></div>
        </div>
        <div class="p-section">
          <h2>Images</h2>
          <div id="pGallery"></div>
        </div>
      </div>

      <aside class="side">
        <div class="sheet ticked">
          <h3>Tools</h3>
          <div id="pTags"></div>
        </div>
        <div class="sheet">
          <h3>Links</h3>
          <div id="pLinks"></div>
        </div>
      </aside>
    </div>

    <div class="wrap">
      <nav class="p-nav" id="pNav" aria-label="Other projects"></nav>
    </div>
  </section>
</main>

<section class="p-error wrap" id="pFail" hidden>
  <h1>This project couldn't be loaded</h1>
  <p class="muted" id="pFailMsg"></p>
  <p><a class="btn" href="../../#projects">Back to all projects</a></p>
</section>

<footer>
  <div class="wrap">
    <span>© <span id="yr">2026</span> Saqib Ali</span>
    <span>Aligarh, India</span>
  </div>
</footer>

<script type="module" src="../../assets/js/project-page.js"></script>
</body>
</html>
